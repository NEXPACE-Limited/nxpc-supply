# Managed address registry — the contracts and wallets the team operates.
#
# Validated by Zod at build time (src/lib/addresses.ts). A malformed address, a
# duplicate id, or the same address listed twice on one chain all fail the build.
#
#   type      contract | eoa
#   category  bridge | vault | treasury | ops | token | infra
#   chain     henesys | c-chain
#   standard  (optional) erc20 | erc721 — name/symbol/totalSupply are read as well
#
# Naming:
#   1. Where the whitepaper (docs.nexpace.io) has a term for it, that term wins —
#      Contribution Reward, Early Community, Liquidity Provision, Gas Sponsorship,
#      Builder Program, IP MG, Team, Advisor, Treasury.
#   2. Otherwise the contract's own name from the public NEXPACE-Limited
#      repositories — nexpace-contracts, nxp-contracts, maple-contract,
#      msn-contract, marketplace-contract, multisig-contract, util-contracts.
#   3. Every executor wallet is labelled «Executor». Labels stay generic, and
#      `id` is keyed off the address, since both reach the browser in `data-bal`
#      and in the live read's id list.
#   4. A contract on Avalanche C-Chain keeps the «C-Chain » prefix instead of the
#      source list's `C_`, because the same address can be a different contract on
#      each chain.
#
# A wallet's chain follows the contract it executes: an executor of a C-Chain
# contract is a C-Chain wallet.
#
# The deployer is shared across chains, so a C-Chain contract can sit at the same
# address as an unrelated Henesys one — «Team» (TeamVestingWallet) and «C-Chain
# Treasury» are the clearest example. Uniqueness is therefore enforced per chain,
# not globally.
#
# Balances come from whichever chain the row is on. Henesys is a native balance;
# on C-Chain, NXPC is an ERC-20, so the figure there is balanceOf on that token —
# an account's own balance would be AVAX, a different unit in the same column.
#
# The `c-chain` rows are not display-only. avaxSupplySpec (src/lib/reads.ts) sums
# them as «the addresses we operate there» and offHenesysFrom (src/lib/fold.ts)
# subtracts that from Avalanche circulating supply, which free float is built on.
# Changing which rows are on that chain therefore changes a published figure —
# check the balance of any C-Chain row before touching it. wallets.yaml cannot
# stand in: that registry is Henesys-only (src/lib/addresses.ts).

